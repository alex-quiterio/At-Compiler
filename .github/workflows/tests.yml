name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CDK21 and RTS7 from vendor/, then the compiler and the examples
      - name: Build
        run: docker build --target build -t at .

      - name: Test
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          docker run --name at-tests -e REPORT=/tmp/tests.md at tests/run.sh || status=$?
          docker cp at-tests:/tmp/tests.md "$RUNNER_TEMP/report/tests.md" || true
          docker rm at-tests > /dev/null
          exit ${status:-0}

      # the job summary, shown on the run's page below the job graph
      - name: Publish the test report
        if: always()
        run: |
          report="$RUNNER_TEMP/report/tests.md"
          if [ -s "$report" ]; then
            cat "$report" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ No test report (the build or the test run failed early)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
